name: Build NEXORA Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake

      - name: Install Buildozer & Prepare Icon
        run: |
          pip install --upgrade pip==24.0 "setuptools<70.0" wheel
          pip install buildozer cython==0.29.36 virtualenv pillow
          python3 -c 'from PIL import Image; Image.open("logo.png").convert("RGBA").resize((512, 512)).save("logo.png", "PNG")'
          sed -i 's/p4a.branch = master/p4a.branch = develop/g' buildozer.spec

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug > build.log 2>&1 || (grep -B 20 -A 3 "Command failed:" build.log || tail -n 50 build.log; exit 1)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-APK
          path: bin/*.apk
